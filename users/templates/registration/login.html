<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Query Builder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{--qb-orange:#ea580c;--qb-orange-light:#fb923c;--qb-orange-soft:#fff7ed;--qb-ink:#1f2937;--qb-muted:#6b7280;}
        *{font-family:'Inter',sans-serif;}
        body{background:linear-gradient(135deg,#fff7ed,#fffdfb);min-height:100vh;color:var(--qb-ink);padding-top:90px;}
        h3,.brand{font-family:'Sora',sans-serif;}

        .navbar{background:#fff;box-shadow:0 4px 18px rgba(234,88,12,.08);}
        .navbar-brand{font-weight:800;font-size:1.4rem;color:var(--qb-orange)!important;display:flex;align-items:center;gap:8px;}
        .navbar-brand .logo-badge{background:linear-gradient(135deg,var(--qb-orange),var(--qb-orange-light));color:#fff;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
        .navbar .nav-link{color:var(--qb-ink)!important;font-weight:600;margin:0 4px;}
        .navbar .nav-link:hover,.navbar .nav-link.active{color:var(--qb-orange)!important;}

        .login-card{max-width:480px;margin:auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(234,88,12,.15);border:1px solid #fde6d3;}
        .login-header{background:linear-gradient(135deg,var(--qb-orange),var(--qb-orange-light));text-align:center;padding:34px;color:#fff;}
        .login-header h3{margin:0;font-weight:800;}
        .login-header p{color:rgba(255,255,255,.92);margin-top:8px;margin-bottom:0;}
        .card-body{padding:36px;}
        .form-label{color:#374151;font-weight:600;}
        .form-control{border:1px solid #f0d3bd;border-radius:10px;padding:12px;}
        .form-control:focus{border-color:var(--qb-orange);box-shadow:0 0 0 .2rem rgba(249,115,22,.18);}
        .input-group-text{background:var(--qb-orange-soft);color:var(--qb-orange);border:1px solid #f0d3bd;}
        .btn-query{background:linear-gradient(135deg,var(--qb-orange),var(--qb-orange-light));border:none;color:#fff;font-weight:700;padding:12px;border-radius:50px;transition:.3s;}
        .btn-query:hover{color:#fff;transform:translateY(-2px);box-shadow:0 10px 22px rgba(234,88,12,.35);}
        .register-link{text-align:center;margin-top:20px;color:var(--qb-muted);}
        .register-link a{color:var(--qb-orange);font-weight:600;text-decoration:none;}
        .register-link a:hover{text-decoration:underline;}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <span class="logo-badge"><i class="fas fa-database"></i></span> Query Builder
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="{% url 'login' %}">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="login-card mt-4">
        <div class="login-header">
            <h3><i class="fas fa-right-to-bracket me-2"></i>Welcome Back</h3>
            <p>Sign in to your Query Builder dashboard</p>
        </div>
        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-query w-100"><i class="fas fa-sign-in-alt me-1"></i> Login</button>
            </form>

            <div class="register-link">
                <small>New to Query Builder? <a href="{% url 'register' %}">Create an Account</a></small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
