<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logout — Query Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{--qb-orange:#ea580c;--qb-orange-light:#fb923c;--qb-orange-soft:#fff7ed;--qb-ink:#1f2937;}
        *{font-family:'Inter',sans-serif;}
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#fff7ed,#fffdfb);margin:0;}
        .logout-card{background:#fff;padding:2.6rem;border-radius:24px;box-shadow:0 20px 50px rgba(234,88,12,.15);border:1px solid #fde6d3;max-width:420px;width:100%;text-align:center;}
        .logout-card .icon{width:72px;height:72px;border-radius:50%;background:var(--qb-orange-soft);color:var(--qb-orange);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 18px;}
        .logout-card h4{font-family:'Sora',sans-serif;font-weight:800;color:var(--qb-ink);}
        .btn-logout{background:#ef4444;color:#fff;border:none;font-weight:700;border-radius:50px;padding:12px;}
        .btn-logout:hover{background:#dc2626;color:#fff;}
        .btn-cancel{background:#fff;color:var(--qb-orange);border:1.5px solid var(--qb-orange);font-weight:600;border-radius:50px;padding:12px;}
        .btn-cancel:hover{background:var(--qb-orange);color:#fff;}
    </style>
</head>
<body>

<div class="logout-card">
    <div class="icon"><i class="fas fa-right-from-bracket"></i></div>
    <h4>Ready to leave?</h4>
    <p class="text-muted">Are you sure you want to log out of Query Builder?</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-logout">Yes, Logout</button>
            <a href="{% url 'home' %}" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
